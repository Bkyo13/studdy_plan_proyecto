name: studyplan
description: StudyPlan, organizador de tareas escolares.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  cloud_firestore: ^7.2.0
  firebase_ai: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  google_sign_in: ^7.2.0
  http: ^1.6.0
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icono.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ECF0EB"
  adaptive_icon_foreground: "assets/icon/icono_frente.png"